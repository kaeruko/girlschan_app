name: iOS Release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "App Store version (for example: 1.0)"
        required: true
        default: "1.0"
        type: string
      build_number:
        description: "Unique App Store build number (for example: 15)"
        required: true
        type: string
      upload_to_app_store:
        description: "Upload the signed IPA to App Store Connect"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  BUNDLE_ID: jp.cloxs.girlschanApp
  FLUTTER_VERSION: 3.47.0

jobs:
  build-and-sign:
    name: Build and sign iOS IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_26.6.app"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Required Xcode was not found: $XCODE_PATH"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate build inputs
        shell: bash
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          if [[ ! "$BUILD_NAME" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::build_name must be numeric dot-separated version text such as 1.0 or 1.0.1. Got: $BUILD_NAME"
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::build_number must be a positive integer. Got: $BUILD_NUMBER"
            exit 1
          fi

          echo "Release version: $BUILD_NAME ($BUILD_NUMBER)"

      - name: Validate signing secrets
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          [[ -n "$CERTIFICATE_BASE64" ]] || { echo "::error::Missing secret IOS_DISTRIBUTION_CERTIFICATE_BASE64"; exit 1; }
          [[ -n "$CERTIFICATE_PASSWORD" ]] || { echo "::error::Missing secret IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"; exit 1; }
          [[ -n "$PROVISIONING_PROFILE_BASE64" ]] || { echo "::error::Missing secret IOS_PROVISIONING_PROFILE_BASE64"; exit 1; }

      - name: Validate App Store Connect secrets
        if: ${{ inputs.upload_to_app_store }}
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          [[ -n "$ASC_KEY_ID" ]] || { echo "::error::Missing secret APP_STORE_CONNECT_API_KEY_ID"; exit 1; }
          [[ -n "$ASC_ISSUER_ID" ]] || { echo "::error::Missing secret APP_STORE_CONNECT_ISSUER_ID"; exit 1; }
          [[ -n "$ASC_API_KEY_P8_BASE64" ]] || { echo "::error::Missing secret APP_STORE_CONNECT_API_KEY_P8_BASE64"; exit 1; }

      - name: Install signing certificate and provisioning profile
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$PROFILE_PATH"

          [[ -s "$CERTIFICATE_PATH" ]] || { echo "::error::Decoded signing certificate is empty"; exit 1; }
          [[ -s "$PROFILE_PATH" ]] || { echo "::error::Decoded provisioning profile is empty"; exit 1; }

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$IDENTITIES"
          if ! grep -q 'Apple Distribution:' <<< "$IDENTITIES"; then
            echo "::error::No Apple Distribution signing identity was found in the supplied .p12"
            exit 1
          fi

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"

          [[ -n "$PROFILE_UUID" ]] || { echo "::error::Provisioning profile UUID is empty"; exit 1; }
          [[ -n "$PROFILE_NAME" ]] || { echo "::error::Provisioning profile name is empty"; exit 1; }
          [[ -n "$TEAM_ID" ]] || { echo "::error::Provisioning profile TeamIdentifier is empty"; exit 1; }

          EXPECTED_APPLICATION_IDENTIFIER="$TEAM_ID.$BUNDLE_ID"
          if [[ "$APPLICATION_IDENTIFIER" != "$EXPECTED_APPLICATION_IDENTIFIER" ]]; then
            echo "::error::Provisioning profile application-identifier mismatch. Expected $EXPECTED_APPLICATION_IDENTIFIER, got $APPLICATION_IDENTIFIER"
            exit 1
          fi

          INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$INSTALL_DIR"
          INSTALLED_PROFILE_PATH="$INSTALL_DIR/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE_PATH" "$INSTALLED_PROFILE_PATH"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "INSTALLED_PROFILE_PATH=$INSTALLED_PROFILE_PATH" >> "$GITHUB_ENV"

          echo "Provisioning profile: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"

      - name: Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -euo pipefail
          pod --version
          cd ios
          pod install

      - name: Archive signed app
        shell: bash
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/Runner.xcarchive"
          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            FLUTTER_BUILD_NAME="$BUILD_NAME" \
            FLUTTER_BUILD_NUMBER="$BUILD_NUMBER" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

          [[ -d "$ARCHIVE_PATH" ]] || { echo "::error::Archive was not created: $ARCHIVE_PATH"; exit 1; }
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export signed IPA
        shell: bash
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_PATH="$RUNNER_TEMP/export"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          plutil -lint "$EXPORT_OPTIONS"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          shopt -s nullglob
          IPA_FILES=("$EXPORT_PATH"/*.ipa)
          if [[ "${#IPA_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one IPA in $EXPORT_PATH, found ${#IPA_FILES[@]}"
            printf '%s\n' "${IPA_FILES[@]:-}"
            exit 1
          fi

          IPA_PATH="${IPA_FILES[0]}"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

          VERIFY_DIR="$RUNNER_TEMP/verify-ipa"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"

          APP_DIRS=("$VERIFY_DIR"/Payload/*.app)
          if [[ "${#APP_DIRS[@]}" -ne 1 || ! -d "${APP_DIRS[0]}" ]]; then
            echo "::error::Expected exactly one .app in IPA Payload, found ${#APP_DIRS[@]}"
            exit 1
          fi

          APP_INFO="${APP_DIRS[0]}/Info.plist"
          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")"
          ACTUAL_BUILD_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO")"
          ACTUAL_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")"

          [[ "$ACTUAL_BUNDLE_ID" == "$BUNDLE_ID" ]] || { echo "::error::IPA bundle ID mismatch: $ACTUAL_BUNDLE_ID"; exit 1; }
          [[ "$ACTUAL_BUILD_NAME" == "$BUILD_NAME" ]] || { echo "::error::IPA version mismatch. Expected $BUILD_NAME, got $ACTUAL_BUILD_NAME"; exit 1; }
          [[ "$ACTUAL_BUILD_NUMBER" == "$BUILD_NUMBER" ]] || { echo "::error::IPA build number mismatch. Expected $BUILD_NUMBER, got $ACTUAL_BUILD_NUMBER"; exit 1; }

          codesign --verify --deep --strict --verbose=2 "${APP_DIRS[0]}"
          echo "Verified signed IPA: $ACTUAL_BUNDLE_ID $ACTUAL_BUILD_NAME ($ACTUAL_BUILD_NUMBER)"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: girlschan-ios-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_app_store }}
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$PRIVATE_KEYS_DIR"
          API_KEY_PATH="$PRIVATE_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | /usr/bin/base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          [[ -s "$API_KEY_PATH" ]] || { echo "::error::Decoded App Store Connect API key is empty"; exit 1; }

          xcrun altool \
            --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${INSTALLED_PROFILE_PATH:-}" && -f "$INSTALLED_PROFILE_PATH" ]]; then
            rm -f "$INSTALLED_PROFILE_PATH"
          fi

          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

          rm -f "$RUNNER_TEMP/distribution.p12" \
                "$RUNNER_TEMP/profile.mobileprovision" \
                "$RUNNER_TEMP/profile.plist"
          rm -rf "$HOME/.appstoreconnect/private_keys"
