name: girlschan_app
description: がるちゃんあぷり
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 共通（モバイル/デスクトップ両方）
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  http: ^1.2.0
  csv: ^6.0.0
  flutter_inappwebview: ^6.0.0
  url_launcher: ^6.2.0
  cupertino_icons: ^1.0.6

  # デスクトップ専用（iOSでは呼ばない＝安全）
  window_manager: ^0.5.1
  webview_flutter: ^4.13.0
  webview_flutter_wkwebview: ^3.23.1

  # 可変高さリストの最適化
  super_sliver_list: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  golden_toolkit: ^0.15.0
  mocktail: ^1.0.3
  # どちらか一方に揃える。両OSで通る方へ
  network_image_mock: ^2.1.1   # ← もしmacOSで不具合なら ^2.1.0 に落とす
  dart_code_linter: ^3.2.0

flutter:
  # Materialを使わないなら `uses-material-design` は不要
  assets:
    - assets/mock_data/topics.json
    - assets/mock_data/
  # フォントをプロジェクトで使わないならフォント定義は省略でOK
  # もし全プラットフォームで同じ和文フォントに固定したい場合は、ここで共通定義に戻す
  # fonts:
  #   - family: NotoSansCJKjp
  #     fonts:
  #       - asset: assets/fonts/NotoSansCJKjp-VF.ttf

flutter_launcher_icons:
  ios: true
  image_path: "assets/icon/ios.png"
