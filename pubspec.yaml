name: girlschan_app
description: がるちゃんあぷり
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  http: ^1.2.0
  csv: ^6.0.0
  flutter_inappwebview: ^6.0.0
  url_launcher: ^6.2.0
  cupertino_icons: ^1.0.8
  window_manager: ^0.3.7
