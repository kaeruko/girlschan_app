name: girlschan_app
description: GirlsChannel offline browser prototype
publish_to: "none" # 公開しない

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  http: ^1.2.0
  csv: ^6.0.0
  flutter_inappwebview: ^6.0.0
  flutter:
    sdk: flutter

  # Cupertinoスタイルのアイコン
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock_data/topics.json
    - assets/mock_data/
