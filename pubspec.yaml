name: girlschan_app
description: がるちゃんあぷり
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  http: ^1.2.0
  csv: ^6.0.0
  flutter_inappwebview: ^6.0.0
  url_launcher: ^6.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  golden_toolkit: ^0.15.0
  mocktail: ^1.0.3
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/mock_data/topics.json
    - assets/mock_data/
    - assets/fonts/NotoSansCJKjp-VF.ttf

  fonts:
    - family: NotoSansCJKjp
      fonts:
        - asset: assets/fonts/NotoSansCJKjp-VF.ttf

flutter_launcher_icons:
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  android: true